<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Osimen Reuben">
    <meta name="description" content="this is a valid html only form application">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="fav-icon.jpg" type="image.jpg">
    <title>Mentorship Application Form</title>
</head>
<body>

    <h1>Mentorship Application Form</h1>
    <p>Please complete all required fields below to apply for our mentorship program.</p>

    <form action="/submit-application" method="POST">

        <!-- Fieldset 1: Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <p> 
                <label for="full-name">Full Name:</label><br>
                <input type="text" id="full-name" name="fullName" required minlength="2" maxlength="100" placeholder="e.g. John Doe">
            </p> 

            <p> 
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required placeholder="e.g. john@example.com">
            </p> 

            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required pattern="[0-9]{10,15}" placeholder="e.g. +1234567890">
            </p>

            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dateOfBirth" required max="2010-01-01">
            </p>

            <p>
                <strong>Gender:</strong><br>
                <input type="radio" id="gender-female" name="gender" value="female" required>
                <label for="gender-female">Female</label><br>
                
                <input type="radio" id="gender-male" name="gender" value="male">
                <label for="gender-male">Male</label><br>

                <input type="radio" id="gender-non-binary" name="gender" value="non-binary">
                <label for="gender-non-binary">Non-binary</label><br>

                <input type="radio" id="gender-prefer-not" name="gender" value="prefer-not-to-say">
                <label for="gender-prefer-not">Prefer not to say</label>
            </p>
        </fieldset>

        <br>

        <!-- Fieldset 2: Development Background & Program Preferences -->
        <fieldset>
            <legend>Development Background & Program Preferences</legend>

            <p>
                <label for="experience-level">Current Experience Level:</label><br>
                <select id="experience-level" name="experienceLevel" required>
                    <option value="" disabled selected>-- Select experience level --</option>
                    <option value="beginner">Beginner (Little to no coding experience)</option>
                    <option value="intermediate">Intermediate (Built basic personal projects)</option>
                    <option value="advanced">Advanced (Comfortable with full-stack or frameworks)</option>
                </select>
            </p>

            <p>
                <strong>Areas of Interest (Select all that apply):</strong><br>
                <input type="checkbox" id="interest-frontend" name="interests" value="frontend">
                <label for="interest-frontend">Frontend Web Development</label><br>

                <input type="checkbox" id="interest-backend" name="interests" value="backend">
                <label for="interest-backend">Backend Web Development</label><br>

                <input type="checkbox" id="interest-fullstack" name="interests" value="fullstack">
                <label for="interest-fullstack">Full-Stack Development</label><br>

                <input type="checkbox" id="interest-uiux" name="interests" value="ui-ux">
                <label for="interest-uiux">UI/UX Design & Fundamentals</label>
            </p>

            <p>
                <label for="learning-track">Preferred Learning Track:</label><br>
                <select id="learning-track" name="learningTrack" required>
                    <option value="" disabled selected>-- Select a track --</option>
                    <option value="web-dev-fundamentals">Web Development Fundamentals (HTML/CSS/JS)</option>
                    <option value="fullstack-engineering">Full-Stack Software Engineering</option>
                    <option value="uiux-design">UI/UX Product Design</option>
                </select>
            </p>

            <p>
                <label for="github-url">GitHub Profile URL:</label><br>
                <input type="url" id="github-url" name="githubUrl" placeholder="https://github.com/username" required>
            </p>

            <p>
                <label for="why-join">Why do you want to join this mentorship?</label><br>
                <textarea id="why-join" name="whyJoin" rows="5" cols="50" required minlength="50" maxlength="1000" placeholder="Share your motivation and goals..."></textarea>
            </p>
        </fieldset>

        <br>

        <!-- Fieldset 3: Availability & Terms -->
        <fieldset>
            <legend>Availability & Agreement</legend>

            <p>
                <label for="availability">Weekly Availability (Hours per week):</label><br>
                <input type="number" id="availability" name="availabilityHours" min="5" max="40" required placeholder="e.g. 15">
            </p>

            <p>
                <input type="checkbox" id="rules-agreement" name="rulesAgreement" value="accepted" required>
                <label for="rules-agreement">I agree to abide by the mentorship program rules and code of conduct.</label>
            </p>
        </fieldset>

        <br>

        <button type="submit">Submit Application</button>
    </form>

</body>
</html>
